# Secret scanning configuration
# https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/custom-patterns/defining-custom-patterns-for-secret-scanning
#
# Custom patterns for org-specific tokens. Enable in repo settings:
#   Settings -> Code security and analysis ->
#     Secret scanning:              Enabled
#     Push protection:              Enabled
#     Validity checks:              Enabled
#     Non-provider patterns:        Enabled
#
# Note: custom patterns are defined in the repo/org settings UI;
# this file documents what this repo expects so the live demo is reproducible.

paths-ignore:
  - "**/*.md"
  - "**/*.example"

# The following pattern names should be configured as custom patterns in
# the repo's security settings. They exist here so the orchestrator agent
# can verify configuration drift deterministically.
custom_patterns_expected:
  - name: "Internal demo token"
    regex: "DEMO_[A-Z0-9]{24}"
  - name: "Internal signing key"
    regex: "SIGN-[A-F0-9]{32}"
